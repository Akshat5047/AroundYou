<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan a Trip | Around You</title><link rel="stylesheet" href="css/style.css"></head><body><nav class="nav"><div class="container navin"><a class="brand" href="index.html">Around <span>You</span></a><div class="links"><a href="index.html">Home</a><a href="explore.html">Explore</a><a href="planner.html">Plan a Trip</a><a href="ask.html">Ask Around You</a><a href="reviews.html">Review Trust</a></div><a class="btn primary" href="planner.html">Plan My Trip</a></div></nav><main><section class="pageHero"><div class="container"><span class="eyebrow">AI Trip Advisor</span><h1>Plan Your Telangana Trip</h1></div></section><section class="section"><div class="container plannerLayout"><form id="planner" class="formCard"><div class="formGrid">
<div class="field"><label>District</label><select id="district"><option>Hyderabad</option><option selected>Hanamkonda</option><option>Warangal</option><option>Mulugu</option></select></div>
<div class="field"><label>Travel Date</label><input id="date" type="date" required></div><div class="field"><label>Days</label><input id="days" type="number" value="2" min="1"></div><div class="field"><label>Travelers</label><input id="people" type="number" value="2" min="1"></div>
<div class="field"><label>Budget (₹)</label><input id="budget" type="number" value="15000"></div><div class="field"><label>Accommodation</label><select id="tier"><option>Budget</option><option>Mid-range</option><option>Premium</option></select></div>
<div class="field"><label>Transport</label><select id="transport"><option>bus</option><option>car</option><option>auto</option><option>bike</option></select></div><div class="field"><label>Route distance (km)</label><input id="distance" type="number" value="150"></div>
<div class="field"><label>Rainfall (mm)</label><input id="rain" type="number" value="5"></div><div class="field"><label>Road access (1–5)</label><input id="road" type="number" min="1" max="5" value="4"></div>
<div class="field"><label>Festival</label><input id="festival" value="None"></div><div class="field full"><label>What kind of trip do you want?</label><textarea id="request" rows="4" placeholder="Interested in Kakatiya temples..."></textarea></div>
<button class="btn primary full">✦ Generate My Trip</button></div><div id="err" class="error"></div></form><div><div id="load" class="loading formCard"><div class="spinner"></div><p>Building your itinerary...</p></div><div id="out" class="result"></div></div></div></section></main><script src="js/planner.js"></script><footer class="footer"><div class="container footerin"><div><b>Around You</b><p>Discover Telangana. Plan Smarter. Travel Better.</p></div><small>AI-powered travel guidance for Telangana.</small></div></footer><script src="js/api.js"></script></body></html>
